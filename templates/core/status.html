{% extends 'base.html' %}{% block content %}<section class="page-head"><h1>Status dos serviços</h1><p>Transparência sobre a operação do RoadLedger.</p></section><section class="section narrow">{% for service in services %}<article class="status-row"><div><strong>{{ service.name }}</strong><p>{{ service.message }}</p></div><span class="status {{ service.status }}">{{ service.get_status_display }}</span></article>{% empty %}<p>Status ainda não publicado.</p>{% endfor %}</section>{% endblock %}
