{% extends 'base.html' %}{% block content %}<section class="page-head"><h1>Atualizações</h1></section><section class="section narrow">{% for item in updates %}<article class="card"><time>{{ item.published_at|date:'d/m/Y' }}</time><h2>{{ item.title }}</h2><p>{{ item.summary }}</p><div>{{ item.body|linebreaks }}</div></article>{% empty %}<p>Nenhuma atualização publicada.</p>{% endfor %}</section>{% endblock %}
